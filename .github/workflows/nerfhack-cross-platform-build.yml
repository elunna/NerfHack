name: NerfHack

on:
  push:
    branches: [ master, dev ]
    tags:
      - '**'
  pull_request:
    branches: [ master, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    runs-on: ubuntu-latest
    env:
      #LUA_VERSION: 5.4.2
      #HINTS_FILE: linux.370
      HINTS_FILE: linux.370
    steps:
    - uses: actions/checkout@v4
    - name: setup
      run: ./sys/unix/setup.sh sys/unix/hints/$HINTS_FILE
    - name: fetch lua
      run: |
        make fetch-lua
    - name: make all
      run: make all
    - name: make install
      run: make install
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nerfhack-linux
        path: ~/nerfhack/install/
        retention-days: 30

  mac-build:
    runs-on: macos-latest
    env:
      HINTS_FILE: macOS.370
    steps:
    - uses: actions/checkout@v4
    - name: setup
      run: |
        ./sys/unix/setup.sh sys/unix/hints/$HINTS_FILE
        make fetch-lua
    - name: make all
      run: make all
    - name: make install
      run: make install
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nerfhack-macos
        path: ~/nerfhackdir/
        retention-days: 30

  windows-build:
    permissions: write-all
    runs-on: windows-latest
    env:
        ADD_LUA: Y
        WANT_LUAC: N
        LUATOP: ../submodules/lua
        LUASRC: ../submodules/lua
        ADD_CURSES: Y
        PDCURSES_TOP: ../submodules/pdcurses
        #LUA_VERSION: 5.4.6
        TRAVIS_COMPILER: 1
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ilammy/msvc-dev-cmd@v1 # enable visual c compiler / nmake
    - name: setup
      run: |
        ./sys/windows/nhsetup.bat
    - name: make package
      run: |
        cd src
        nmake package
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nerfhack-windows
        path: package/
        retention-days: 30
    - uses: thedoctor0/zip-release@0.7.6
      if: startsWith(github.ref, 'refs/tags/')
      with:
        type: 'zip'
        path: package/
        filename: nerfhack-${{ github.ref_name }}-windows.zip
    - name: release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          nerfhack-${{ github.ref_name }}-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
